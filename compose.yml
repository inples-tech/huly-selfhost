name: ${DOCKER_NAME}

# Ждём брокер перед стартом сервиса. После перезагрузки хоста контейнеры
# поднимаются вперемешку, и если redpanda ещё нет, kafkajs делает пять попыток
# на getaddrinfo ENOTFOUND, сдаётся навсегда и больше не возвращается к очереди.
# Сервис при этом продолжает работать и выглядит здоровым: порт слушает, в логе
# тишина. Так 18.09.2026 остались без очереди transactor, fulltext и telegram-bot.
# depends_on это не лечит — при рестарте по политике демон поднимает контейнеры
# без оглядки на порядок compose, поэтому ждём прямо в команде.
# $$ — экранирование для интерполяции compose, в контейнер уезжает один доллар.
x-wait-queue: &wait-queue >-
  until (exec 3<>/dev/tcp/redpanda/9092) 2>/dev/null;
  do echo "ждём redpanda:9092"; sleep 2; done;
  exec "$$0" "$$@"

# То же самое для транзактора. Сервисы-интеграции подключаются к нему по websocket
# один раз при старте: не достучались — молча живут дальше и ничего не синхронизируют.
x-wait-transactor: &wait-transactor >-
  until (exec 3<>/dev/tcp/transactor/3333) 2>/dev/null;
  do echo "ждём transactor:3333"; sleep 2; done;
  exec "$$0" "$$@"

services:
  nginx:
    # Свой образ: конфиг вложен внутрь, а не примонтирован снаружи.
    # Почему так — в docker/nginx/Dockerfile.
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: huly-nginx-configured:${HULY_VERSION}
    ports:
      - "${HTTP_BIND}:${HTTP_PORT}:80"
    # nginx резолвит upstream'ы ядра при старте и падает, если имя не найдено,
    # поэтому эти контейнеры должны быть созданы раньше. Опциональные интеграции
    # сюда не добавлять — они резолвятся в рантайме через resolver в .huly.nginx.
    depends_on:
      - front
      - account
      - transactor
      - collaborator
      - rekoni
      - stats
    restart: unless-stopped
    networks:
      - huly_net

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${CR_DATABASE}
      - COCKROACH_USER=${CR_USERNAME}
      - COCKROACH_PASSWORD=${CR_USER_PASSWORD}
    volumes:
      - ${VOLUME_CR_DATA_PATH:-cr_data}:/cockroach/cockroach-data
      - ${VOLUME_CR_CERTS_PATH:-cr_certs}:/cockroach/certs
    restart: unless-stopped
    networks:
      - huly_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - ${VOLUME_REDPANDA_PATH:-redpanda}:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${REDPANDA_ADMIN_USER}
      - REDPANDA_SUPERUSER_PASSWORD=${REDPANDA_ADMIN_PWD}
    healthcheck:
      # Брокер стартует в --mode dev-container, где SASL не включён, а клиенты
      # (QUEUE_CONFIG=redpanda:9092) ходят без аутентификации. Проба с -X user/pass
      # даёт ILLEGAL_SASL_STATE и держит контейнер вечно unhealthy.
      test: ['CMD', 'rpk', 'cluster', 'info']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - huly_net

  minio:
    image: "minio/minio"
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - ${VOLUME_FILES_PATH:-files}:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - huly_net

  elastic:
    image: "elasticsearch:7.14.2"
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - ${VOLUME_ELASTIC_PATH:-elastic}:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
    networks:
      - huly_net

  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    volumes:
      - ${VOLUME_MONGO_PATH:-mongodb}:/data/db
    networks:
      - huly_net
    # Required by aibot and calendar services, plus the telegram account integration

  # Присутствие и живые обновления: кто сейчас смотрит документ, курсоры
  # соавторов, статусы «онлайн». Фронт соединяется по PULSE_URL напрямую
  # вебсокетом (`${PULSE_URL}?token=...`), поэтому nginx переписывает
  # /_pulse в /ws — сервис слушает вебсокеты именно там, а /status и /api
  # остаются для диагностики изнутри сети.
  #
  # Конфиг читается либо из etc/config.toml, либо из переменных с префиксом
  # HULY_ — второе удобнее: секрет приходит из панели, а не из файла в git.
  # Backend memory: присутствие эфемерно, переживать рестарт ему незачем,
  # redis понадобится только при нескольких экземплярах сервиса.
  hulypulse:
    image: hardcoreeng/hulypulse:${HULY_VERSION}
    environment:
      - HULY_BIND_PORT=8099
      - HULY_LOG=info
      - HULY_TOKEN_SECRET=${SECRET}
      - HULY_BACKEND=memory
      - HULY_HEARTBEAT_TIMEOUT=60
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - huly_net

  # Пуш-уведомления в браузер и на телефон. Транзактор шлёт сюда POST /web-push
  # с подписками и телом уведомления, сервис подписывает их VAPID-ключами.
  # Авторизация — тот же MAIL_AUTH_TOKEN: транзактор переиспользует его как
  # Bearer для этого вызова (mailAuth в sendPushToSubscription).
  # Без пары ключей сервис поднимется, но будет молча возвращать пустой
  # результат — в логе это одна строка "VAPID keys not configured".
  notification:
    image: hardcoreeng/notification:${HULY_VERSION}
    environment:
      - PORT=8091
      - SOURCE=${HOST_ADDRESS}
      - AUTH_TOKEN=${MAIL_AUTH_TOKEN}
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY}
      - PUSH_PRIVATE_KEY=${PUSH_PRIVATE_KEY}
      - PUSH_SUBJECT=mailto:huly@inples.ru
      - STATS_URL=http://stats:4900
    restart: unless-stopped
    networks:
      - huly_net

  # Автоматизация Process: правила вида «задача перешла в статус X → назначить,
  # уведомить, создать дочернюю». Сервис слушает топик process в redpanda.
  #
  # TEMPORAL_ADDRESS и TEMPORAL_NAMESPACE в конфиге есть, но клиента Temporal
  # в бандле нет и без них сервис поднимается и входит в группу потребителей —
  # проверено на живом контейнере. Понадобятся, если всплывут шаги с ожиданием.
  process:
    image: hardcoreeng/process:${HULY_VERSION}
    environment:
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - QUEUE_REGION=
      - COLLABORATOR_URL=ws://collaborator:3078
    command: ["bash", "-c", *wait-queue, "node", "bundle.js"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - huly_net

  # CalDAV: календарь Huly в Apple Calendar, Thunderbird и телефоне.
  # Внутри rustical со своим хранилищем поверх Huly — Google не нужен.
  # Кэш синхронизации кладём в наш kvs, чтобы не заводить сервису том.
  #
  # Маршруты живут на /caldav от корня, поэтому nginx проксирует префикс как
  # есть, без rewrite. CardDAV (контакты) в этой сборке нет — /carddav отдаёт 404.
  # Доступ включает сам пользователь: в интерфейсе появляется пункт CalDAV Access,
  # который заводит интеграцию kind=caldav с отдельным паролем приложения.
  huly-caldav:
    image: hardcoreeng/huly-caldav:${HULY_VERSION}
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=4000
      - LOG_LEVEL=info
      - ACCOUNTS_URL=http://account:3000
      - SERVER_SECRET=${SECRET}
      - KV_URL=http://kvs:8094
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - huly_net

  # Публичная страница записи на встречу — аналог Calendly внутри Huly.
  # Маршруты: /{workspace}/{schedule} и /api/{timeslots,book,cancel,reschedule}.
  #
  # SMTP_URL здесь — не почтовый сервер, а наш сервис mail: письма уходят
  # через POST {SMTP_URL}/send с тем же MAIL_AUTH_TOKEN.
  #
  # Живёт на своём поддомене: ассеты Astro запрошены по абсолютному /_astro,
  # под префиксом страница осталась бы без стилей.
  huly-schedule:
    # Свой образ поверх штатного: одна заплатка, чтобы бронирование не падало.
    # Подробности — в docker/huly-schedule/Dockerfile.
    build:
      context: ./docker/huly-schedule
      args:
        HULY_VERSION: ${HULY_VERSION}
    image: huly-schedule-patched:${HULY_VERSION}
    environment:
      - PORT=8060
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - ACCOUNT_URL=http://account:3000
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - SECRET=${SECRET}
      - SMTP_URL=http://mail:8097
      - SMTP_API_KEY=${MAIL_AUTH_TOKEN}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - huly_net

  # Выгрузка пространств и документов из интерфейса: Huly собирает архив и отдаёт
  # его пользователю. Своей базы у сервиса нет — он ходит в ту же CockroachDB и
  # в MinIO за вложениями, поэтому ему нужны DB_URL и STORAGE_CONFIG.
  #
  # Обязательные переменные, без любой из них падает на старте с
  # «Missing config for attributes»: SECRET, ACCOUNTS_URL, SERVICE_ID, DB_URL.
  export:
    image: hardcoreeng/export:${HULY_VERSION}
    environment:
      - PORT=4009
      - SECRET=${SECRET}
      - SERVICE_ID=export-service
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      account:
        condition: service_started
    restart: unless-stopped
    networks:
      - huly_net

  # Резервные копии воркспейсов силами самой Huly. Два сервиса, и нужны оба:
  # backup раз в час снимает снапшот каждого воркспейса в бакет, backup-api
  # отдаёт интерфейсу опись — раздел «Резервные копии» в настройках дёргает
  # <BACKUP_URL>/<workspaceDataId>/index.json и без этого сервиса пуст.
  # Раздел виден только владельцу воркспейса.
  #
  # Снапшоты кладём в наш MinIO, бакет backups. Это не замена ночному бэкапу
  # HLY-7: тот уезжает на внешний S3 Beget и защищает от потери хоста, а этот
  # даёт восстановление отдельного воркспейса и разбор по доменам прямо из UI.
  # Понадобится вынести наружу — достаточно поменять STORAGE на s3-строку.
  backup:
    image: hardcoreeng/backup:${HULY_VERSION}
    environment:
      - SECRET=${SECRET}
      - SERVICE_ID=backup-service
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_DB_URL=${CR_DB_URL}
      - DB_URL=${CR_DB_URL}
      - STATS_URL=http://stats:4900
      - BUCKET_NAME=backups
      - STORAGE=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - WORKSPACE_STORAGE=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      # Раз в час, снапшотов держим 84 — это умолчания сервиса, зафиксированы явно.
      - INTERVAL=3600
      - KEEP_SNAPSHOTS=84
      - PARALLEL=1
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      account:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - huly_net

  backup-api:
    image: hardcoreeng/backup-api:${HULY_VERSION}
    environment:
      - PORT=4039
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - BUCKET_NAME=backups
      - STORAGE=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - STATS_URL=http://stats:4900
    depends_on:
      account:
        condition: service_started
    restart: unless-stopped
    networks:
      - huly_net

  # Сбор событий интерфейса: клиент шлёт батчи на POST /collect, сервис их
  # принимает и, если задан PostHog, пересылает туда. Нам это нужно не как
  # маркетинговая аналитика, а чтобы видеть, какими модулями команда реально
  # пользуется, и ловить клиентские ошибки.
  #
  # POSTHOG_HOST и POSTHOG_API_KEY намеренно не заданы: сервис проверяет их на
  # !== undefined, и пустая строка заставила бы его слать батчи в никуда.
  # Пока их нет, события видны только в логе контейнера строками
  # «Received batch: N events» — хранилища у сервиса своего нет.
  analytics-collector:
    image: hardcoreeng/analytics-collector:${HULY_VERSION}
    environment:
      - PORT=4007
      - SECRET=${SECRET}
      - SERVICE_ID=analytics-collector-service
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      # - POSTHOG_HOST=${POSTHOG_HOST}
      # - POSTHOG_API_KEY=${POSTHOG_API_KEY}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      account:
        condition: service_started
    restart: unless-stopped
    networks:
      - huly_net

  # Разворачивание ссылок в чате, комментариях и документах: заголовок,
  # описание и картинка вместо голого URL. Ходит во внешний интернет сам.
  link-preview:
    image: hardcoreeng/link-preview:${HULY_VERSION}
    environment:
      - PORT=4041
      - SECRET=${SECRET}
      - SERVICE_ID=link-preview-service
      - STATS_URL=http://stats:4900
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - huly_net

  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION}
    environment:
      - SECRET=${SECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    networks:
      - huly_net

  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://localhost:8087
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
      # Пуши уходят через notification; без переменной транзактор их просто не шлёт.
      - WEB_PUSH_URL=http://notification:8091
      - MAIL_URL=http://mail:8097
      - MAIL_AUTH_TOKEN=${MAIL_AUTH_TOKEN}
    command: ["bash", "-c", *wait-queue, "node", "./bundle.js"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - huly_net

  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    restart: unless-stopped
    networks:
      - huly_net

  # Исходящие письма: приглашения в workspace, сброс пароля, уведомления.
  # Шлюз на nodemailer, наружу не торчит — account и transactor ходят в него
  # по huly_net. API_KEY здесь и MAIL_AUTH_TOKEN у клиентов должны совпадать:
  # ключ уезжает в теле запроса полем apiKey, несовпадение даёт 401.
  # PORT обязателен, дефолта у сервиса нет — без него контейнер падает на старте.
  mail:
    image: hardcoreeng/mail:${HULY_VERSION}
    environment:
      - PORT=8097
      - SOURCE=${SMTP_SOURCE}
      - REPLY_TO=${SMTP_REPLY_TO:-}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      # secure — TLS сразу (465), upgrade — STARTTLS (587), ignore — без шифрования
      - SMTP_TLS_MODE=${SMTP_TLS_MODE:-upgrade}
      - API_KEY=${MAIL_AUTH_TOKEN}
      - STATS_URL=http://stats:4900
    restart: unless-stopped
    networks:
      - huly_net

  account:
    image: hardcoreeng/account:${HULY_VERSION}
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:+s}://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - STATS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - MAIL_URL=http://mail:8097
      - MAIL_AUTH_TOKEN=${MAIL_AUTH_TOKEN}
      # Название продукта в письмах с приглашениями и кодами входа.
      - BRANDING_PATH=/var/cfg/branding.json
      # Регистрация закрыта: инстанс рабочий, аккаунты заводятся приглашением.
      # Сервис читает переменную как DISABLE_SIGNUP !== "true", поэтому значение
      # должно быть строкой "true" — любое другое снова открывает регистрацию.
      - DISABLE_SIGNUP=true
      # Админ-панель Huly (список воркспейсов, миграции, управление аккаунтами).
      # Сверяется адрес, под которым входят, а не почта в профиле: признак admin
      # кладётся в токен при логине. Поэтому здесь ровно те email, что заведены
      # в global_account.social_id. oleg@inples.ru оставлен на будущее — такого
      # аккаунта пока нет, а регистрация закрыта, завести можно приглашением.
      - ADMIN_EMAILS=9488488@gmail.com,oleg@inples.ru
      # Блокировка подбора пароля. Значение совпадает с умолчанием сервиса —
      # выставлено явно, чтобы не зависеть от смены умолчания при обновлении.
      # Счётчик обнуляется при верном пароле, но заблокированный аккаунт верный
      # пароль уже не принимает: снимается только сбросом пароля.
      - MAX_FAILED_LOGIN_ATTEMPTS=5
      # Вход через внешних провайдеров. Сервис включает провайдера по факту
      # наличия пары id/secret, поэтому пустую строку подставлять нельзя —
      # кнопка входа появится нерабочей. GitHub включён (OAuth App
      # inpleshulyauth в inples-tech) и Google (клиент «iNPLES SSO» в проекте
      # huly-inples) включены, OIDC ждёт своего провайдера.
      # Адреса колбэков, которые нужно указать при создании приложений:
      #   GitHub — https://erp.inples.ru/_accounts/auth/github/callback
      #   Google — https://erp.inples.ru/_accounts/auth/google/callback
      #   OIDC   — https://erp.inples.ru/_accounts/auth/openid/callback
      # Регистрацию это не открывает: при DISABLE_SIGNUP=true провайдер пускает
      # только тех, чей адрес уже заведён в аккаунтах, остальным отказ.
      - GITHUB_CLIENT_ID=${SSO_GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${SSO_GITHUB_CLIENT_SECRET}
      - GITHUB_DISPLAY_NAME=GitHub
      - GOOGLE_CLIENT_ID=${SSO_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${SSO_GOOGLE_CLIENT_SECRET}
      - GOOGLE_DISPLAY_NAME=Google
      # - OPENID_CLIENT_ID=${SSO_OPENID_CLIENT_ID}
      # - OPENID_CLIENT_SECRET=${SSO_OPENID_CLIENT_SECRET}
      # - OPENID_ISSUER=${SSO_OPENID_ISSUER}
      # - OPENID_DISPLAY_NAME=SSO
    volumes:
      - ./branding/branding.json:/var/cfg/branding.json:ro
    command: ["bash", "-c", *wait-queue, "node", "bundle.js"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - huly_net

  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION}
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:+s}://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=${CR_DB_URL}
    # - INIT_REPO_DIR=/no-init-scripts
      - MAIL_URL=http://mail:8097
      - MAIL_AUTH_TOKEN=${MAIL_AUTH_TOKEN}
      # Название продукта в письмах с приглашениями и кодами входа.
      - BRANDING_PATH=/var/cfg/branding.json
    volumes:
      - ./branding/branding.json:/var/cfg/branding.json:ro
    command: ["bash", "-c", *wait-queue, "node", "bundle.js"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - huly_net

  front:
    # Свой образ: брендинг вложен внутрь, а не примонтирован снаружи.
    # Почему так — в docker/front/Dockerfile.
    build:
      context: .
      dockerfile: docker/front/Dockerfile
      args:
        HULY_VERSION: ${HULY_VERSION}
    image: huly-front-branded:${HULY_VERSION}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET}
      - LOVE_ENDPOINT=http${SECURE:+s}://${HOST_ADDRESS}/_love
      # Без LIVEKIT_WS front отдаёт пустую строку и звонок не поднимается.
      - LIVEKIT_WS=${LIVEKIT_WS}
      - ACCOUNTS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=http${SECURE:+s}://${HOST_ADDRESS}/_rekoni
      - CALENDAR_URL=http${SECURE:+s}://${HOST_ADDRESS}/_calendar
      - GMAIL_URL=http${SECURE:+s}://${HOST_ADDRESS}/_gmail
      # Две разные интеграции на разных адресах: TELEGRAM_URL — подключение личного
      # аккаунта (сервис telegram), TELEGRAM_BOT_URL — уведомления (telegram-bot).
      # TELEGRAM_URL обязателен: без него front падает с "please provide telegram url".
      - TELEGRAM_URL=http${SECURE:+s}://${HOST_ADDRESS}/_telegram
      - TELEGRAM_BOT_URL=http${SECURE:+s}://${HOST_ADDRESS}/_telegram-bot
      - GITHUB_URL=http${SECURE:+s}://${HOST_ADDRESS}/_github
      # Адрес ai-bot. Без него в комнате не появляется кнопка расшифровки:
      # фронт считает, что ИИ-сервиса в инсталляции нет.
      - AI_URL=http${SECURE:+s}://${HOST_ADDRESS}/_aibot
      # Адрес сервиса рендера/печати. Без него markdown-вложения открываются
      # сырым текстом, а превью docx и печать в PDF в интерфейсе не появляются.
      - PRINT_URL=http${SECURE:+s}://${HOST_ADDRESS}/_print
      - GITHUB_APP=${GITHUB_APP_SLUG}
      - GITHUB_CLIENTID=${GITHUB_CLIENTID}
      - STATS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=ws${SECURE:+s}://${HOST_ADDRESS}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - TITLE=${TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_CHANNEL}
      - DISABLED_FEATURES=auto-translate,mailboxes
      # Фронт прячет форму регистрации; сама проверка живёт в account.
      - DISABLE_SIGNUP=true
      # Публичный VAPID-ключ: по нему браузер оформляет подписку на пуши.
      # Приватный знает только notification.
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY}
      # Присутствие. Схема ws: клиент открывает соединение по этому адресу
      # напрямую, без промежуточного HTTP-запроса.
      - PULSE_URL=ws${SECURE:+s}://${HOST_ADDRESS}/_pulse
      - LINK_PREVIEW_URL=http${SECURE:+s}://${HOST_ADDRESS}/_link-preview
      - EXPORT_URL=http${SECURE:+s}://${HOST_ADDRESS}/_export
      - BACKUP_URL=http${SECURE:+s}://${HOST_ADDRESS}/_backup
      - ANALYTICS_COLLECTOR_URL=http${SECURE:+s}://${HOST_ADDRESS}/_analytics
      # Адрес, который интерфейс показывает пользователю для настройки
      # календаря на телефоне и в почтовом клиенте.
      - CALDAV_SERVER_URL=http${SECURE:+s}://${HOST_ADDRESS}/caldav
      # Поддомен, а не префикс: см. комментарий у huly-schedule.
      - PUBLIC_SCHEDULE_URL=https://${SCHEDULE_HOST:-schedule.inples.ru}
      # Брендинг: заголовок вкладки и favicon. Фронт ищет в файле ключ,
      # равный хосту открытой страницы, поэтому адрес обязан быть абсолютным.
      - BRANDING_URL=http${SECURE:+s}://${HOST_ADDRESS}/branding/branding.json
    restart: unless-stopped
    networks:
      - huly_net

  # Рендерит markdown-вложения в HTML по контракту print-сервиса, который
  # фронт уже умеет вызывать (DOCXViewer -> convertToHTML). Всё, что не
  # markdown, и запросы печати уходят в print. Секретов не требует:
  # пробрасывает токен пользователя, авторизует сам Huly.
  mdconvert:
    image: ghcr.io/inples-tech/huly-mdconvert:latest
    pull_policy: always
    environment:
      - PORT=4030
      - HULY_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - UPSTREAM_PRINT_URL=http://print:4005
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - huly_net

  # Штатный print: превью docx и печать в PDF. Внутри Chromium, поэтому
  # память ограничена явно — рядом живёт всё остальное ядро Huly.
  print:
    image: hardcoreeng/print:${HULY_VERSION}
    environment:
      - PORT=4005
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - FRONT_URL=http://front:8080
      - STATS_URL=http://stats:4900
      - SERVICE_ID=print-service
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      account:
        condition: service_started
    restart: unless-stopped
    networks:
      - huly_net

  telegram-bot:
    image: hardcoreeng/telegram-bot:${HULY_VERSION}
    environment:
      - PORT=4020
      - DB_URL=${CR_DB_URL}
      - BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ACCOUNTS_URL=http://account:3000
      - SECRET=${SECRET}
      - SERVICE_ID=telegram-bot-service
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - QUEUE_CONFIG=redpanda:9092
      - QUEUE_REGION=
    command: ["bash", "-c", *wait-queue, "node", "bundle.js"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - huly_net

  github:
    image: hardcoreeng/github:${HULY_VERSION}
    environment:
      - PORT=3500
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - APP_ID=${GITHUB_APPID}
      - CLIENT_ID=${GITHUB_CLIENTID}
      - CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - COLLABORATOR_URL=ws${SECURE:+s}://${HOST_ADDRESS}/_collaborator
      - WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - BOT_NAME=${GITHUB_APP_SLUG}[bot]
    # PRIVATE_KEY подаётся отдельным файлом: это многострочный PEM, а панель
    # Dokploy срезает кавычки в .env, из-за чего строки ключа превращаются
    # в «переменные» и docker compose отказывается читать файл целиком.
    # Ключ с литеральными \n не подходит — crypto.createPrivateKey его не парсит.
    # Файл лежит на хосте вне git и вне Dokploy: /etc/huly-secrets/github.env (0600).
    env_file:
      - /etc/huly-secrets/github.env
    command: ["bash", "-c", *wait-transactor, "node", "bundle.js"]
    # Сервис подключается к транзактору один раз при старте и переподключаться не умеет.
    # Транзактор перезапустился — его сессия закрывается («session hang, closing» в логе
    # транзактора), и дальше каждое событие от GitHub падает на ConnectionClosed в
    # _getAccountRaw. Контейнер при этом здоров: процесс жив, порт слушает, ошибки видно
    # только в логе. 18.09.2026 так потерялись четыре часа вебхуков и три PR по edlegal-web.
    # Healthcheck смотрит на живое TCP-соединение с transactor:3333 в /proc/net/tcp
    # (0D05 = 3333, состояние 01 = ESTABLISHED); порвалось — контейнер уходит в unhealthy,
    # и его перезапускает autoheal. В образе нет ни curl, ни wget, поэтому проверка на node.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const fs=require('fs'),dns=require('dns');
          dns.lookup('transactor',(e,ip)=>{
            if(e)process.exit(1);
            const want=ip.split('.').reverse().map(o=>(+o).toString(16).padStart(2,'0')).join('').toUpperCase()+':0D05';
            const est=fs.readFileSync('/proc/net/tcp','utf8').split('\n').slice(1).filter(Boolean)
              .some(r=>{const f=r.trim().split(/\s+/);return f[2]===want&&f[3]==='01'});
            process.exit(est?0:1);
          });
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - autoheal=true
    depends_on:
      transactor:
        condition: service_started
    restart: unless-stopped
    networks:
      - huly_net

  # Интеграция Google Calendar. Образ публичный и, в отличие от аккаунт-интеграции
  # Telegram, реально отдаёт REST, которого ждёт фронт: /signin, /signin/code,
  # /signout, /push. Токены сотрудников сервис держит в account и kvs, своей БД у него нет.
  #
  # WATCH_URL — адрес, который сервис передаёт Google при подписке на изменения
  # календаря. Google шлёт туда вебхуки, поэтому адрес обязан быть публичным и
  # домен — подтверждённым во владении в том же проекте Google Cloud.
  #
  # Credentials — JSON OAuth-клиента целиком (тип «веб-приложение»), сервис берёт из
  # него web.redirect_uris[0]. Имя переменной именно с заглавной C, так в коде сервиса.
  # Файл лежит вне git и вне Dokploy по тем же причинам, что и ключ GitHub App:
  # панель срезает кавычки в .env, и JSON рассыпается на «переменные».
  calendar:
    image: hardcoreeng/calendar:${HULY_VERSION}
    environment:
      - PORT=8095
      - SECRET=${SECRET}
      - SERVICE_ID=calendar-service
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - KVS_URL=http://kvs:8094
      - WATCH_URL=http${SECURE:+s}://${HOST_ADDRESS}/_calendar/push
      - INIT_LIMIT=50
    env_file:
      - /etc/huly-secrets/google.env
    depends_on:
      account:
        condition: service_started
      kvs:
        condition: service_started
    restart: unless-stopped
    networks:
      - huly_net

  # Docker сам по себе на unhealthy не реагирует: restart-политика смотрит только на то,
  # жив ли процесс. Autoheal раз в 30 секунд перезапускает контейнеры, помеченные
  # autoheal=true, — сейчас это только github. Сокет монтируется read-only; для restart
  # этого хватает, докер проверяет права не по флагу монтирования, а по доступу к сокету.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION}
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    command: ["bash", "-c", *wait-queue, "node", "--expose-gc", "bundle.js"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - huly_net

  stats:
    image: hardcoreeng/stats:${HULY_VERSION}
    environment:
      - PORT=4900
      - SERVER_SECRET=${SECRET}
    restart: unless-stopped
    networks:
      - huly_net

  # --- Видеозвонки: LiveKit (медиа) + love (токены, вебхуки, запись) ---------
  #
  # Сигнальный WebSocket приходит на livekit.inples.ru через traefik, медиа идёт
  # напрямую на хост: UDP 7882 (мультиплекс) и TCP 7881 (fallback для клиентов
  # за жёстким NAT). Диапазон UDP-портов сознательно не публикуем.
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit.yaml
    volumes:
      - ./.livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # Формат "имя_ключа: секрет"; имя обязано совпадать с webhook.api_key
      # в .livekit.yaml.
      # Кавычки обязательны: без них ": " делает из строки словарь и
      # docker compose падает на "unexpected type map".
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped
    networks:
      - huly_net

  # Redis нужен не сам по себе: через него livekit-server и egress находят
  # друг друга (psrpc). Без него startTrackEgress уходит в никуда, а
  # listEgress отвечает Internal service panic.
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - huly_net

  livekit-egress:
    image: livekit/egress:v1.9.1
    # Конфиг — однострочный YAML во flow-стиле в EGRESS_CONFIG_BODY.
    # Переносы строк тут невозможны дважды: docker обрезает значение
    # переменной на первом переносе, а панель Dokploy портит многострочные
    # значения. Поэтому файл на хосте, как приватный ключ GitHub App.
    # Файл не воспроизводится из репозитория: при переносе VPS создать заново.
    env_file:
      - /etc/huly-secrets/egress.env
    # Нужен для песочницы headless Chrome. Мы снимаем только отдельные
    # аудиодорожки (TrackEgress), браузер при этом не поднимается, но образ
    # проверяет доступность капабилити на старте.
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          # На хосте свободно около 5.5 ГБ, и рядом живёт боевой Huly.
          # Предел выставлен намеренно: на granai.ru сборка без лимита
          # положила весь хост по OOM.
          memory: 2G
    depends_on:
      - redis
      - livekit
    restart: unless-stopped
    networks:
      - huly_net

  # Расшифровка созвонов: пишет аудиодорожки участников через LiveKit Egress,
  # отправляет в Gemini и возвращает итог в Huly. Репозиторий сервиса —
  # inples-tech/huly-meetscribe, образ собирается в GitHub Actions и приезжает
  # из GHCR: на этом хосте рядом живёт боевой Huly, собирать здесь нельзя.
  meetscribe:
    image: ghcr.io/inples-tech/huly-meetscribe:latest
    # Без этого docker compose up -d не перекачивает изменившийся тег latest:
    # контейнер молча продолжает работать на старом образе, и выкатка правки
    # выглядит успешной, ничего не изменив.
    pull_policy: always
    environment:
      - PORT=4030
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # Endpoint обязательно с портом: love теряет его в этом самом месте,
      # и его запись поэтому не работает с нашим MinIO.
      - S3_ENDPOINT=http://minio:9000
      # Отдельный пользователь с политикой только на свой бакет. minioadmin —
      # суперпользователь всего хранилища, включая файлы Huly.
      - S3_ACCESS_KEY=${MEETSCRIBE_S3_KEY}
      - S3_SECRET_KEY=${MEETSCRIBE_S3_SECRET}
      - S3_BUCKET=meetscribe
      - HULY_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - HULY_TOKEN=${MEETSCRIBE_HULY_TOKEN}
      - HULY_WORKSPACE_URL=${MEETSCRIBE_WORKSPACE}
      - HULY_PROJECT=${MEETSCRIBE_PROJECT}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${MEETSCRIBE_TG_CHAT}
      - STATE_DB=/state/meetscribe.db
      # Модель вызывается через собственный шлюз LiteLLM по приватной сети
      # WireGuard, а не напрямую: Gemini API отвечает этому хосту
      # "User location is not supported for the API use" — Google блокирует
      # запросы по географии сервера. Шлюз уводит их через purchase-gw
      # за пределы РФ и заодно считает расход.
      - LLM_BASE_URL=http://10.10.0.2:4000
      - LLM_MODEL=gemini-3-flash
    # Виртуальный ключ шлюза лежит файлом на хосте, вне git и вне панели —
    # тот же приём, что с приватным ключом GitHub App и конфигом egress.
    # Файл не воспроизводится из репозитория: при переносе VPS создать заново.
    env_file:
      - /etc/huly-secrets/llm.env
    volumes:
      # Состояние встреч в SQLite. Без постоянного тома перезапуск посреди
      # встречи тихо теряет весь её итог.
      - meetscribe_state:/state
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - livekit
      - livekit-egress
    restart: unless-stopped
    networks:
      - huly_net

  # --- Живая расшифровка созвонов --------------------------------------------
  #
  # ai-bot заводит себе учётную запись в воркспейсе (huly.ai.bot@hc.engineering),
  # принимает реплики от агента и пишет их в карточку встречи по ходу звонка.
  # Мongo ему нужен под собственное хранилище — ядро Huly живёт на CockroachDB
  # и Mongo не использует.
  aibot:
    image: hardcoreeng/ai-bot:${HULY_VERSION}
    environment:
      - PORT=4010
      - SERVER_SECRET=${SECRET}
      - SERVICE_ID=ai-bot-service
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - DB_URL=${CR_DB_URL}
      - MONGO_URL=mongodb://mongodb:27017
      - QUEUE_CONFIG=redpanda:9092
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - LOVE_ENDPOINT=http://love:8096
      - FIRST_NAME=${AIBOT_FIRST_NAME:-Huly}
      - LAST_NAME=${AIBOT_LAST_NAME:-AI}
      - PASSWORD=${AIBOT_PASSWORD}
      # Саммари и перевод идут через тот же шлюз LiteLLM, что и meetscribe:
      # OpenAI-совместимый API, за ним Gemini. Прямого ключа OpenAI у нас нет.
      - OPENAI_API_KEY=${AIBOT_LLM_KEY}
      - OPENAI_BASE_URL=http://10.10.0.2:4000/v1
      - OPENAI_MODEL=${AIBOT_LLM_MODEL:-gemini-3-flash}
      - OPENAI_TRANSLATE_MODEL=${AIBOT_LLM_MODEL:-gemini-3-flash}
      - OPENAI_SUMMARY_MODEL=${AIBOT_LLM_MODEL:-gemini-3-flash}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      account:
        condition: service_started
      mongodb:
        condition: service_started
      love:
        condition: service_started
      redpanda:
        condition: service_healthy
    command: ["bash", "-c", *wait-queue, "node", "bundle.js"]
    restart: unless-stopped
    networks:
      - huly_net

  # Агент LiveKit: подключается к комнате отдельным участником, слушает дорожки
  # и стримит звук в Deepgram, реплики отдаёт в ai-bot. Адрес Deepgram зашит в
  # образе, через шлюз LiteLLM его не увести — поэтому ключ отдельный.
  # PLATFORM_TOKEN — токен учётной записи самого ai-bot: сервис сверяет его с
  # своим account uuid и на чужом токене отвечает 401.
  love-agent:
    image: hardcoreeng/love-agent:${HULY_VERSION}
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - PLATFORM_URL=http://aibot:4010
      - PLATFORM_TOKEN=${LOVE_AGENT_TOKEN}
      - STT_PROVIDER=deepgram
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      # nova-3 с language=multi — единственная связка, которая слышит русский
      # вперемешку с английским; агент выставляет multi сам.
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL:-nova-3}
      # Набор подобран по записи реального созвона: с настройками по умолчанию
      # Deepgram отдавал одну реплику на первой фразе и потом молчал минуту,
      # сваливая весь разговор в один кусок — «расшифровка упала» выглядит
      # именно так. Виноват smart_format: он копит результат до своей границы.
      # Лечится no_delay, с ним реплики идут раз в три секунды.
      # utterance_end_ms Deepgram принимает только вместе с interim_results —
      # без них рвёт рукопожатие с 400 ещё до первого кадра звука, а агент
      # падает на необработанной ошибке сокета и уносит с собой всю встречу.
      - DG_PUNCTUATE=true
      - DG_SMART_FORMAT=true
      - DG_NO_DELAY=true
      - DG_INTERIM_RESULTS=true
      - DG_ENDPOINTING=10
      - DG_UTTERANCE_END_MS=1000
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - livekit
      - aibot
    restart: unless-stopped
    networks:
      - huly_net

  love:
    image: hardcoreeng/love:${HULY_VERSION}
    environment:
      - PORT=8096
      - SECRET=${SECRET}
      - SERVICE_ID=love-service
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - LIVEKIT_HOST=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # Запись комнаты силами love намеренно не включена: она умеет только
      # room-composite MP4 720p/1080p, а нам для расшифровки нужен звук.
      # При kind=minio checkRecordAvailable отдаёт false и кнопка записи
      # в интерфейсе не появляется. Аудиозапись делает отдельный сервис.
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - STORAGE_PROVIDER_NAME=minio
    depends_on:
      - livekit
      - account
    restart: unless-stopped
    networks:
      - huly_net

  kvs:
    image: hardcoreeng/hulykvs:${HULY_VERSION}
    depends_on:
      cockroach:
        condition: service_started
    ports:
      - 8094:8094
    environment:
      - HULY_DB_CONNECTION=${CR_DB_URL}
      - HULY_TOKEN_SECRET=${SECRET}
    restart: unless-stopped
    networks:
      - huly_net
      
volumes:
  meetscribe_state:
  # These named volumes are used when custom volume paths are not specified
  # If VOLUME_*_PATH variables are set, these volumes will be ignored
  elastic:
  files:
  cr_data:
  cr_certs:
  redpanda:
  mongodb:

networks:
  huly_net:

# LiveKit SFU для видеозвонков Huly (сервис love).
#
# Секретов здесь нет намеренно: пара ключ/секрет подаётся переменной LIVEKIT_KEYS
# в формате "имя_ключа: секрет" — она живёт в .env Dokploy, а не в git.
# Имя ключа должно совпадать с webhook.api_key ниже.

port: 7880
log_level: info

rtc:
  # Один TCP-порт для ICE-fallback и один UDP-порт с мультиплексированием.
  # Диапазон портов не публикуем: docker-proxy на диапазоне в десятки тысяч
  # портов стартует минутами и ест память.
  tcp_port: 7881
  udp_port: 7882
  # Внутри контейнера виден только адрес docker-сети, поэтому публичный IP
  # LiveKit выясняет сам через STUN. Если исходящий STUN закроют — прописать
  # адрес хоста явно переменной NODE_IP и выставить здесь false.
  use_external_ip: true

room:
  # Комнату создаёт первый вошедший участник: love выдаёт токен, но саму
  # комнату заранее не заводит.
  auto_create: true
  empty_timeout: 300

# Общий с egress. Через Redis livekit-server видит egress-воркер; без этого
# блока запись дорожек не работает, а listEgress паникует.
redis:
  address: redis:6379

webhook:
  # Ключ из LIVEKIT_KEYS, которым подписываются вебхуки.
  api_key: huly
  urls:
    # Порядок важен: love первым, чтобы сервис расшифровки не мог задержать
    # обработку событий комнаты.
    - http://love:8096/webhook
    - http://meetscribe:4030/webhook

turn:
  # Встроенный TURN для клиентов за корпоративным файрволом, где открыт только
  # 443 (GRA-742). Порт 443 занят traefik'ом, поэтому TLS терминирует он по SNI
  # turn.inples.ru и шлёт открытый TCP на tls_port; external_tls говорит
  # LiveKit не поднимать TLS самому и объявлять клиентам turns:...:443.
  # Диапазон relay_range наружу не публикуется: встроенный TURN ретранслирует
  # в SFU этого же процесса.
  enabled: true
  domain: turn.inples.ru
  tls_port: 5349
  udp_port: 3478
  external_tls: true
